name: Check channels
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # كل 30 دقيقة
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 check_channels.py content_v2.json
      - name: Commit status
        run: |
          git config user.name "horizon-bot"
          git config user.email "bot@users.noreply.github.com"
          git add channels_status.json channels_status.md
          git diff --cached --quiet || git commit -m "channels status" && git push
